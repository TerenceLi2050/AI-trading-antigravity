[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csi800-quant-screen"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.1", "pyarrow>=12", "baostock>=0.8.9", "requests>=2.28", "xlrd>=2.0"]

[project.optional-dependencies]
data = ["baostock>=0.8.9", "akshare>=1.14", "requests>=2.28", "xlrd>=2.0"]
research = ["scipy>=1.10", "scikit-learn>=1.3", "lightgbm>=4.0", "catboost>=1.2", "joblib>=1.3", "matplotlib>=3.7"]
test = ["pytest>=7"]

[project.scripts]
quant-screen = "quant_screen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/csi800-quant-screen" = ["configs/default.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
